<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi autocaravana</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--ink:#16282c;--panel:#ffffff;--accent:#0d6b63;--accent-d:#094c47;--route:#ff7a1a;--warn:#b3261e;--line:#cfd8d6}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:18px/1.4 "Atkinson Hyperlegible",system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column;background:#dfe7e5}
input,textarea{font:inherit;padding:12px;border:2px solid var(--line);border-radius:10px;width:100%;color:var(--ink)}
input:focus,textarea:focus,button:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
button{font:inherit;font-weight:700;min-height:54px;padding:0 18px;border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer}
button:hover{background:var(--accent-d)}
button.sec{background:#e6eeec;color:var(--ink)}
button.sec:hover{background:#d3dfdc}
button.danger{background:#fbe9e7;color:var(--warn)}
#wrap{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0}
#bar button.on{background:var(--route);color:#16282c}
.pin{font-size:30px;line-height:1;filter:drop-shadow(0 2px 2px #0007)}
.dot{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--route)}
.overlay{position:fixed;inset:0;background:#000a;z-index:2000;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:var(--panel);border-radius:16px;padding:20px;width:100%;max-width:480px;max-height:92vh;overflow:auto}
.card h2{margin:0 0 12px;font-size:1.3rem}
.card label{display:block;font-weight:700;margin:12px 0 4px}
.row{display:flex;gap:8px;margin-top:16px}
.row button{flex:1}
.item{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item .t{flex:1}
.item small{color:#536b68;display:block}
.item button{min-height:44px;padding:0 12px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px;cursor:pointer}
.leaflet-popup-content{font:17px/1.4 "Atkinson Hyperlegible",system-ui,sans-serif;margin:14px 16px}
.leaflet-popup-content h3{margin:0 0 4px;font-size:1.15rem}
.big img{max-width:100%;max-height:85vh;border-radius:10px}
.empty{color:#536b68;padding:8px 0}
.lg{display:flex;gap:8px;align-items:flex-start;padding:9px 12px;cursor:pointer;border-bottom:1px solid #eef2f1}
.lg:hover{background:#f1f6f5}
.lg i{flex:none;width:30px;height:7px;border-radius:4px;margin-top:8px}
.lg b{display:block;line-height:1.2}
.lg small{color:#536b68;display:block}
.lg button{min-height:34px;padding:0 10px;margin-left:auto;background:#e6eeec;color:var(--ink);font-size:.9rem}
.handle{width:26px;height:26px;border-radius:50%;background:#fff;border:5px solid #16282c;box-shadow:0 1px 5px #0008;cursor:grab}
#sum b{color:#ffb703}
#search{display:flex;gap:6px;margin:0 0 8px}
#search input{padding:8px 10px;font-size:15px;min-width:0}
#search button{min-height:38px;padding:0 10px;font-size:14px}
#bar{display:flex;flex-direction:column;gap:6px}
#bar button{min-height:40px;font-size:15px;padding:0 12px;text-align:left}
.lg>div{min-width:0;flex:1}
#hint{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);z-index:1000;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;max-width:min(92%,640px);text-align:center;display:none;box-shadow:0 3px 12px #0005;font-size:16px}
#sum{display:none;gap:4px 22px;justify-content:center;flex-wrap:wrap;padding:5px 12px;font-size:15px;background:var(--ink);color:#fff;z-index:1000}
#side{position:absolute;left:10px;top:10px;z-index:1000;width:240px;max-height:calc(100% - 20px);overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:0 10px 10px 0;scrollbar-width:thin}
#tabs{display:flex;gap:8px;flex:none}
#tabs button{min-height:44px;font-size:15px;padding:0 10px;white-space:nowrap;flex:1;box-shadow:0 2px 8px #0005}
#panel,#legend{flex:none;background:var(--panel);border-radius:14px;box-shadow:0 2px 12px #0005}
#panel{padding:10px}
#legend{padding:4px 6px 6px}
#panel.off,#legend.off{display:none}
#legend h4{margin:0;padding:8px 6px 6px;font-size:1rem}
@media(max-width:560px){#side{width:210px}}
.dot{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--route);font:700 12px/18px sans-serif;text-align:center;color:#16282c}
.st{margin:6px 0 2px;padding-left:20px;font-size:.9rem}.st span{color:#536b68}
.leaflet-popup-content .row{margin-top:10px;flex-direction:column}
#legend .lg b{font-size:1.02rem}
.tl{margin:8px 0 4px}
.tl-stop{display:flex;gap:12px;align-items:flex-start}
.tl-dot{flex:none;width:30px;height:30px;border-radius:50%;border:4px solid;background:#fff;font:700 14px/22px sans-serif;text-align:center}
.tl-stop b{display:block;font-size:1.05rem;line-height:1.2;margin-top:2px}
.tl-stop small{color:#536b68;display:block}
.tl-leg{margin:2px 0 2px 13px;padding:8px 0 8px 24px;border-left:4px solid;font-weight:700;font-size:.95rem}
.tl-sum{margin:0 0 10px;color:#536b68}.tl-sum b{color:var(--ink)}
.sw{display:inline-block;width:28px;height:8px;border-radius:4px;margin-right:10px;vertical-align:middle}
</style>
</head>
<body>
<div id="wrap">
  <div id="map"></div>
  <div id="side">
    <div id="tabs"><button id="tm">☰ Menú ▾</button><button id="tr" hidden>Mis rutas ▾</button></div>
    <aside id="panel">
      <form id="search"><input id="q" placeholder="Buscar lugar" aria-label="Buscar lugar"><button>Buscar</button></form>
      <nav id="bar"></nav>
    </aside>
    <div id="legend" hidden></div>
  </div>
  <div id="hint"></div>
</div>
<div id="sum"></div>
<input type="file" id="fi" accept=".json,application/json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const KEY='autocaravana-v1';
let data={routes:[],areas:[]};
try{data=JSON.parse(localStorage.getItem(KEY))||data}catch(e){}
data.routes.forEach(r=>{if(r.segs&&!r.coords)r.coords=r.segs.flatMap(s=>s.c)});
function save(){try{localStorage.setItem(KEY,JSON.stringify(data,function(k,v){return k==='coords'&&this.segs?undefined:v}));return true}catch(e){alert('No hay espacio para guardar más fotos. Prueba a borrar alguna.');return false}}
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const hm=s=>{const m=Math.round(s/60);return m<60?m+' min':Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min'};
const secs=a=>a.reduce((x,s)=>x+(s.t??s.d/22),0);

// Mapa
const map=L.map('map',{zoomControl:false}).setView([40.2,-3.7],6);
L.control.zoom({position:'bottomright'}).addTo(map);
// Al encuadrar, deja libre la zona que tapa el menú
const _fb=map.fitBounds.bind(map);
map.fitBounds=(b,o={})=>{
  const m=o.padding?o.padding[0]:40,v=o.padding?o.padding[1]:40;
  const menu=(!$('panel').classList.contains('off')||(data.routes.length&&!$('legend').classList.contains('off')))&&innerWidth>=560;
  return _fb(b,{maxZoom:o.maxZoom,paddingTopLeft:[menu?270:m,v],paddingBottomRight:[m,v]});
};
const sat=L.layerGroup([
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18,attribution:'Imagery © Esri'}),
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:18})
]);
const plain=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
let isSat=true;sat.addTo(map);

// Barra de botones
let mode=null,selId=null;
function bar(){
  const b=$('bar');
  if(mode)$('panel').classList.remove('off');
  syncTabs();
  if(mode==='route'){
    b.innerHTML='<button class="sec" id="undo">Deshacer último punto</button><button id="done">Terminar ruta</button><button class="danger" id="cancel">Cancelar</button>';
    $('undo').onclick=undoPoint;$('done').onclick=finishRoute;$('cancel').onclick=cancelMode;
  }else if(mode==='edit'){
    b.innerHTML='<button id="sv">Guardar cambios</button><button class="danger" id="cancel">Cancelar</button>';
    $('sv').onclick=saveEdit;$('cancel').onclick=cancelMode;
  }else if(mode==='area'){
    b.innerHTML='<button class="danger" id="cancel">Cancelar</button>';$('cancel').onclick=cancelMode;
  }else{
    b.innerHTML='<button id="nr">Nueva ruta</button><button id="na">Añadir área</button><button class="sec" id="list">Mis rutas y áreas</button><button class="sec" id="lay">'+(isSat?'Ver mapa':'Ver satélite')+'</button><button class="sec" id="gr">Guardar rutas</button><button class="sec" id="cr">Cargar rutas</button>';
    $('nr').onclick=()=>startMode('route');$('na').onclick=()=>startMode('area');$('list').onclick=openList;$('lay').onclick=toggleLayer;$('gr').onclick=exportData;$('cr').onclick=()=>$('fi').click();
  }
}
function hint(t){const h=$('hint');h.style.display=t?'block':'none';h.textContent=t||''}
function startMode(m){mode=m;bar();hint(m==='route'?'Toca el mapa para añadir cada parada de la ruta.':'Toca el mapa donde estuvo el área.')}
function cancelMode(){mode=null;clearDraft();clearEdit();hint('');bar();draw()}
function toggleLayer(){if(isSat){map.removeLayer(sat);plain.addTo(map)}else{map.removeLayer(plain);sat.addTo(map)}isSat=!isSat;bar()}

// Buscar
$('search').onsubmit=async e=>{
  e.preventDefault();const q=$('q').value.trim();if(!q)return;
  try{
    const r=await (await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q))).json();
    if(!r.length){alert('No encuentro ese lugar. Prueba con otro nombre.');return}
    map.setView([+r[0].lat,+r[0].lon],13);
  }catch(err){alert('No se pudo buscar. Comprueba que tienes internet.')}
};

// Crear ruta
let pts=[],segs=[],stops=[],draftGroup=L.layerGroup().addTo(map),draftLine=null,busy=false;
function clearDraft(){pts=[];segs=[];stops=[];draftGroup.clearLayers();draftLine=null}
function km(){return segs.reduce((s,x)=>s+x.d,0)/1000}
function redraw(){
  draftGroup.clearLayers();
  const all=segs.flatMap(s=>s.c);
  if(all.length)L.polyline(all,{color:'#ff7a1a',weight:6,opacity:.95}).addTo(draftGroup);
  pts.forEach((p,i)=>L.marker(p,{icon:L.divIcon({className:'',html:'<div class="dot">'+(i+1)+'</div>',iconSize:[24,24],iconAnchor:[12,12]}),interactive:false}).addTo(draftGroup));
  hint(pts.length<2?'Toca el mapa para añadir la siguiente parada.':'Llevas '+km().toFixed(1)+' km · '+hm(secs(segs))+'. Sigue añadiendo paradas o pulsa «Terminar ruta».');
}
function pickStop(info){
  const last=[...stops].reverse().find(s=>s.hasta)?.hasta||new Date().toISOString().slice(0,10);
  const go=h=>addPoint({...info,name:$('pn').value.trim()||info.name},h);
  modal(`<h2>Nueva parada</h2><label for="pn">Nombre</label><input id="pn" value="${esc(info.name)}">
    <label for="h">¿Hasta cuándo te quedas aquí?</label><input id="h" type="date" value="${last}">
    <div class="row" style="flex-direction:column"><button id="ok">Aceptar</button><button class="sec" id="np">Solo paso por aquí</button><button class="sec" data-x>Cancelar</button></div>`,
    ()=>go($('h').value),()=>{$('np').onclick=()=>{go('');closeModal()}});
}
async function addPoint(info,hasta){
  if(busy)return;
  const p=[info.lat,info.lng],st={name:info.name,type:info.type,hasta:hasta||''};
  if(!pts.length){pts.push(p);stops.push(st);redraw();return}
  busy=true;hint('Calculando…');
  const seg=await routeBetween(pts[pts.length-1],p);
  segs.push(seg);pts.push(p);stops.push(st);busy=false;redraw();
}
function undoPoint(){if(pts.length>1){pts.pop();segs.pop();stops.pop()}else{pts=[];stops=[]}redraw()}
function finishRoute(){
  if(segs.length<1){alert('Marca al menos dos puntos en el mapa.');return}
  const hoy=new Date();const d=hoy.toISOString().slice(0,10);const d0=stops.find(s=>s.hasta)?.hasta||d,d1=[...stops].reverse().find(s=>s.hasta)?.hasta||d0;
  modal(`<h2>Guardar ruta</h2><p>${km().toFixed(1)} km · ${hm(secs(segs))} conduciendo<br><small>Tiempo estimado en coche; en autocaravana suele ser algo más.</small></p>
    <label for="n">Nombre</label><input id="n" value="Ruta del ${hoy.toLocaleDateString('es-ES')}">
    <label for="d">Día que empecé</label><input id="d" type="date" value="${d0}">
    <label for="e">Día que terminé</label><input id="e" type="date" value="${d1}">
    <div class="row"><button class="sec" data-x>Seguir editando</button><button id="ok">Guardar</button></div>`,
    ()=>{
      let ini=$('d').value,fin=$('e').value||ini;if(fin<ini)fin=ini;
      data.routes.push({id:Date.now(),name:$('n').value.trim()||'Ruta sin nombre',date:ini,end:fin,color:colors[data.routes.length%colors.length],km:km(),pts:pts.slice(),segs:segs.slice(),stops:stops.slice(),t:secs(segs),coords:segs.flatMap(s=>s.c)});
      if(!save())return false;mode=null;clearDraft();hint('');bar();draw();
    });
}

// Áreas
function openAreaForm(ll,nombre){
  let photos=[];
  modal(`<h2>Nueva área</h2>
    <label for="n">Nombre del área</label><input id="n" placeholder="Ej. Área de Zahara de los Atunes" value="${esc(nombre||'')}">
    <label for="d">Fecha</label><input id="d" type="date" value="${new Date().toISOString().slice(0,10)}">
    <label for="t">Notas</label><textarea id="t" rows="3" placeholder="Precio, servicios, qué tal fue…"></textarea>
    <label for="f">Fotos</label><input id="f" type="file" accept="image/*" multiple>
    <div class="thumbs" id="th"></div>
    <div class="row"><button class="sec" data-x>Cancelar</button><button id="ok">Guardar área</button></div>`,
    ()=>{
      data.areas.push({id:Date.now(),name:$('n').value.trim()||'Área sin nombre',date:$('d').value,notes:$('t').value.trim(),lat:ll.lat,lng:ll.lng,photos});
      if(!save()){data.areas.pop();return false}
      mode=null;hint('');bar();draw();
    },
    ()=>{$('f').onchange=async e=>{
      for(const f of e.target.files){try{photos.push(await shrink(f))}catch(err){}}
      $('th').innerHTML=photos.map(p=>`<img src="${p}" alt="">`).join('');
    }});
}
async function shrink(file){
  const bmp=await createImageBitmap(file);const s=Math.min(1,700/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=bmp.width*s;c.height=bmp.height*s;
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.65);
}

// Editar una ruta guardada
let ed=null,edBusy=false;const editGroup=L.layerGroup().addTo(map);
async function routeBetween(a,b){
  try{
    const j=await (await fetch(`https://router.project-osrm.org/route/v1/driving/${a[1]},${a[0]};${b[1]},${b[0]}?overview=full&geometries=geojson`)).json();
    const r=j.routes[0];return{c:r.geometry.coordinates.map(x=>[x[1],x[0]]),d:r.distance,t:r.duration};
  }catch(e){return{c:[a,b],d:map.distance(a,b),t:map.distance(a,b)/22}}
}
function clearEdit(){ed=null;editGroup.clearLayers()}
function startEdit(id){
  const r=data.routes.find(x=>x.id==id);if(!r)return;
  if(!r.color)r.color=colors[data.routes.indexOf(r)%colors.length];
  let P,S;
  if(r.pts&&r.segs){P=r.pts.map(p=>p.slice());S=r.segs.map(s=>({c:s.c,d:s.d,t:s.t}))}
  else{
    const n=r.coords.length,k=Math.min(8,n-1),idx=[];
    for(let i=0;i<=k;i++)idx.push(Math.round(i*(n-1)/k));
    P=idx.map(i=>r.coords[i]);S=[];
    for(let i=0;i<k;i++){const c=r.coords.slice(idx[i],idx[i+1]+1);let d=0;for(let j=1;j<c.length;j++)d+=map.distance(c[j-1],c[j]);S.push({c,d})}
  }
  closeModal();map.closePopup();clearDraft();
  const T=(r.stops&&r.stops.length===P.length)?r.stops.map(x=>({...x})):P.map((_,i)=>({name:'Punto '+(i+1),type:'libre',hasta:''}));ed={r,pts:P,segs:S,stops:T};mode='edit';bar();draw();drawEdit();
  map.fitBounds(L.latLngBounds(r.coords),{padding:[70,70]});
}
function drawEdit(){
  editGroup.clearLayers();if(!ed)return;
  const color=ed.r.color;
  ed.segs.forEach((s,i)=>L.polyline(s.c,{color,weight:9,opacity:.95}).addTo(editGroup)
    .on('click',e=>{L.DomEvent.stopPropagation(e);insertPoint(i,e.latlng)}));
  ed.pts.forEach((p,i)=>{
    const m=L.marker(p,{draggable:true,icon:L.divIcon({className:'',html:'<div class="handle"></div>',iconSize:[26,26],iconAnchor:[13,13]})}).addTo(editGroup);
    m.on('dragend',()=>movePoint(i,m.getLatLng()));
    m.on('click',()=>{
      const st=ed.stops[i]||{},box=document.createElement('div');
      box.innerHTML='<h3>'+esc(st.name||'Punto '+(i+1))+'</h3>'+(st.hasta?'Hasta '+fmt(st.hasta):'Solo paso por aquí')+'<div class="row"></div>';
      const b1=document.createElement('button');b1.className='sec';b1.textContent='Cambiar nombre y fecha';b1.onclick=()=>{map.closePopup();editStop(i)};
      box.lastChild.appendChild(b1);
      if(ed.pts.length>2){const b2=document.createElement('button');b2.textContent='Quitar este punto';b2.onclick=()=>{map.closePopup();removePoint(i)};box.lastChild.appendChild(b2)}
      m.bindPopup(box).openPopup();
    });
  });
  const k=ed.segs.reduce((a,s)=>a+s.d,0)/1000;
  hint('Editando «'+ed.r.name+'» · '+k.toFixed(1)+' km. Arrastra un punto blanco para corregir. Toca la línea para añadir un punto. Toca un punto para quitarlo.');
}
async function movePoint(i,ll){
  if(edBusy){drawEdit();return}
  edBusy=true;hint('Calculando…');ed.pts[i]=[ll.lat,ll.lng];
  if(i>0)ed.segs[i-1]=await routeBetween(ed.pts[i-1],ed.pts[i]);
  if(i<ed.pts.length-1)ed.segs[i]=await routeBetween(ed.pts[i],ed.pts[i+1]);
  edBusy=false;drawEdit();
}
async function insertPoint(i,ll){
  if(edBusy)return;edBusy=true;hint('Calculando…');
  const p=[ll.lat,ll.lng];
  const s1=await routeBetween(ed.pts[i],p),s2=await routeBetween(p,ed.pts[i+1]);
  ed.pts.splice(i+1,0,p);ed.segs.splice(i,1,s1,s2);ed.stops.splice(i+1,0,{name:'Punto de paso',type:'libre',hasta:''});edBusy=false;drawEdit();
}
async function removePoint(i){
  if(edBusy)return;edBusy=true;hint('Calculando…');
  const n=ed.pts.length;ed.pts.splice(i,1);ed.stops.splice(i,1);
  if(i===0)ed.segs.splice(0,1);
  else if(i===n-1)ed.segs.splice(n-2,1);
  else{const s=await routeBetween(ed.pts[i-1],ed.pts[i]);ed.segs.splice(i-1,2,s)}
  edBusy=false;drawEdit();
}
function editStop(i){
  const st=ed.stops[i];
  modal(`<h2>Parada ${i+1}</h2><label for="sn">Nombre</label><input id="sn" value="${esc(st.name)}">
    <label for="sh">Hasta cuándo me quedo</label><input id="sh" type="date" value="${st.hasta||''}">
    <div class="row"><button class="sec" data-x>Cancelar</button><button id="ok">Aceptar</button></div>`,
    ()=>{st.name=$('sn').value.trim()||st.name;st.hasta=$('sh').value;drawEdit()});
}
function saveEdit(){
  if(edBusy)return;
  const r=ed.r,k=ed.segs.reduce((a,s)=>a+s.d,0)/1000;
  modal(`<h2>Guardar cambios</h2><p>${k.toFixed(1)} km · ${hm(secs(ed.segs))} conduciendo</p>
    <label for="n">Nombre</label><input id="n" value="${esc(r.name)}">
    <label for="d">Día que empecé</label><input id="d" type="date" value="${r.date||''}">
    <label for="e">Día que terminé</label><input id="e" type="date" value="${r.end||r.date||''}">
    <div class="row"><button class="sec" data-x>Seguir editando</button><button id="ok">Guardar</button></div>`,
    ()=>{
      const ini=$('d').value;let fin=$('e').value||ini;if(fin<ini)fin=ini;
      Object.assign(r,{name:$('n').value.trim()||'Ruta sin nombre',date:ini,end:fin,km:k,pts:ed.pts,segs:ed.segs,stops:ed.stops,t:secs(ed.segs),coords:ed.segs.flatMap(s=>s.c)});
      if(!save())return false;
      mode=null;clearEdit();hint('');bar();draw();
    });
}

// Guardar y cargar copia
function exportData(){
  if(!data.routes.length&&!data.areas.length){alert('Todavía no hay nada que guardar.');return}
  const txt=JSON.stringify({app:'autocaravana',version:1,data},function(k,v){return k==='coords'&&this.segs?undefined:v});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
  a.download='mis-rutas-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
$('fi').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  let inc;
  try{
    const j=JSON.parse(await f.text());inc=j.data||j;
    if(!Array.isArray(inc.routes)||!Array.isArray(inc.areas))throw 0;
  }catch(err){alert('Este archivo no es una copia de rutas válida.');return}
  inc.routes.forEach(r=>{if(r.segs&&!r.coords)r.coords=r.segs.flatMap(s=>s.c)});
  modal(`<h2>Cargar rutas</h2><p>El archivo tiene <b>${inc.routes.length}</b> rutas y <b>${inc.areas.length}</b> áreas.</p>
    <div class="row" style="flex-direction:column"><button id="add">Añadir a lo que ya tengo</button><button class="sec" id="rep">Sustituir todo lo que tengo</button><button class="sec" data-x>Cancelar</button></div>`,null,()=>{
    const prev=JSON.stringify(data);
    const fin=()=>{if(!save()){data=JSON.parse(prev);return}closeModal();draw();
      const g=L.featureGroup(saved.getLayers());if(g.getBounds().isValid())map.fitBounds(g.getBounds(),{padding:[40,40]})};
    $('add').onclick=()=>{
      const rid=new Set(data.routes.map(r=>r.id)),aid=new Set(data.areas.map(a=>a.id));
      inc.routes.filter(r=>!rid.has(r.id)).forEach(r=>data.routes.push(r));
      inc.areas.filter(a=>!aid.has(a.id)).forEach(a=>data.areas.push(a));fin();
    };
    $('rep').onclick=()=>{if(confirm('Se borrará lo que tienes ahora y se pondrá lo del archivo. ¿Seguro?')){data={routes:inc.routes,areas:inc.areas};fin()}};
  });
};

// Leyenda y resumen
const fmt=s=>s?new Date(s+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}):'';
const col=(r,i)=>r.color||colors[i%colors.length];
const rango=r=>{const f=r.end||r.date;return f&&f!==r.date?fmt(r.date)+' → '+fmt(f):fmt(r.date)};
function legend(){
  const L_=$('legend'),S=$('sum');
  $('tr').hidden=!data.routes.length;L_.hidden=!data.routes.length;
  if(!data.routes.length){S.style.display='none';return}
  L_.innerHTML='<h4>Mis rutas</h4>'+data.routes.map((r,i)=>`<div class="lg" data-r="${r.id}"><i style="background:${col(r,i)}"></i><div><b>${esc(r.name)}</b></div><button data-edit="${r.id}">Editar</button></div>`).join('');
  L_.querySelectorAll('.lg').forEach(el=>el.onclick=ev=>{if(ev.target.closest('[data-edit]'))return;const r=data.routes.find(x=>x.id==el.dataset.r);selId=r.id;drawSel();map.fitBounds(L.latLngBounds(r.coords),{padding:[40,40]});openRoute(r)});
  const ini=data.routes.map(r=>r.date).filter(Boolean).sort()[0];
  const fin=data.routes.map(r=>r.end||r.date).filter(Boolean).sort().pop();
  const tot=data.routes.reduce((a,r)=>a+r.km,0),tt=data.routes.reduce((a,r)=>a+(r.t||0),0);
  S.style.display='flex';
  S.innerHTML=`<span>Empecé el <b>${fmt(ini)||'—'}</b></span><span>Terminé el <b>${fmt(fin)||'—'}</b></span><span>Total: <b>${tot.toFixed(1)} km</b></span>${tt?`<span>Conduciendo: <b>${hm(tt)}</b></span>`:''}`;
}

// Ventana de la ruta: cronología con paradas y tiempos
function openRoute(r){
  const color=r.color||colors[data.routes.indexOf(r)%colors.length];
  const n=(r.pts||[]).length,stops=r.stops||[];let tl='';
  if(n){
    for(let i=0;i<n;i++){
      const s=stops[i]||{name:'Punto '+(i+1),hasta:''};
      tl+=`<div class="tl-stop"><span class="tl-dot" style="border-color:${color}">${i+1}</span><div><b>${esc(s.name)}</b><small>${s.hasta?'Se queda hasta el '+fmt(s.hasta):(i===n-1?'Fin de la ruta':'Solo paso por aquí')}</small></div></div>`;
      const g=r.segs&&r.segs[i];
      if(g)tl+=`<div class="tl-leg" style="border-color:${color}">🚐 ${g.d<10000?(g.d/1000).toFixed(1):(g.d/1000).toFixed(0)} km · ${hm(g.t??g.d/22)}</div>`;
    }
  }else tl='<p class="empty">Esta ruta es antigua y no tiene paradas guardadas. Pulsa «Editar ruta» para añadirlas.</p>';
  modal(`<h2><span class="sw" style="background:${color}"></span>${esc(r.name)}</h2>
    <p class="tl-sum"><b>${rango(r)}</b><br>${r.km.toFixed(1)} km${r.t?' · '+hm(r.t)+' conduciendo':''}</p>
    <div class="tl">${tl}</div>
    <div class="row"><button class="sec" data-x>Cerrar</button><button data-edit="${r.id}">Editar ruta</button></div>`);
}

// Paradas de la ruta seleccionada
const selGroup=L.layerGroup().addTo(map);
function drawSel(){
  selGroup.clearLayers();const r=data.routes.find(x=>x.id==selId);if(!r||!r.pts)return;
  r.pts.forEach((p,i)=>{const s=(r.stops||[])[i]||{};
    L.marker(p,{icon:L.divIcon({className:'',html:'<div class="dot">'+(i+1)+'</div>',iconSize:[24,24],iconAnchor:[12,12]})}).addTo(selGroup)
      .bindPopup('<h3>'+esc(s.name||'Punto '+(i+1))+'</h3>'+(s.hasta?'Hasta '+fmt(s.hasta):'Solo paso por aquí'))});
}

// Dibujar lo guardado
const saved=L.layerGroup().addTo(map);
const colors=['#ff7a1a','#e63946','#ffd60a','#4cc9f0','#b5179e','#80ed99'];
function draw(){
  saved.clearLayers();
  data.routes.forEach((r,i)=>{
    if(ed&&ed.r===r)return;
    L.polyline(r.coords,{color:col(r,i),weight:5,opacity:.9}).addTo(saved)
      .bindPopup(`<h3>${esc(r.name)}</h3>${rango(r)} · ${r.km.toFixed(1)} km${r.t?' · '+hm(r.t):''}<div class="row"><button data-edit="${r.id}">Editar ruta</button></div>`);
  });
  legend();drawSel();
  data.areas.forEach(a=>{
    L.marker([a.lat,a.lng],{icon:L.divIcon({className:'',html:'<div class="pin">🚐</div>',iconSize:[30,30],iconAnchor:[15,28],popupAnchor:[0,-26]})}).addTo(saved)
      .bindPopup(()=>`<h3>${esc(a.name)}</h3>${esc(a.date)}${a.notes?'<br>'+esc(a.notes):''}<div class="thumbs">${a.photos.map((p,i)=>`<img src="${p}" alt="Foto ${i+1}" data-a="${a.id}" data-i="${i}">`).join('')}</div>${mode==='route'?`<div class="row"><button data-stop="u${a.id}">Añadir a la ruta</button></div>`:''}`);
  });
}
document.addEventListener('click',e=>{
  const eb=e.target.closest('[data-edit]');
  if(eb){startEdit(eb.dataset.edit);return}
  const sb=e.target.closest('[data-stop]');
  if(sb){const a=data.areas.find(x=>x.id==sb.dataset.stop.slice(1));map.closePopup();pickStop({name:a.name,type:'mia',lat:a.lat,lng:a.lng});return}
  const im=e.target.closest('.thumbs img[data-a]');
  if(im){const a=data.areas.find(x=>x.id==im.dataset.a);modal(`<div class="big"><img src="${a.photos[im.dataset.i]}" alt=""></div><div class="row"><button data-x>Cerrar</button></div>`)}
});

// Lista
function openList(){
  const fecha=s=>s?new Date(s).toLocaleDateString('es-ES'):'';
  const rs=data.routes.map(r=>`<div class="item"><div class="t"><b>${esc(r.name)}</b><small>${rango(r)} · ${r.km.toFixed(1)} km${r.t?' · '+hm(r.t):''}</small></div><button data-v="r${r.id}">Ver</button><button class="sec" data-edit="${r.id}">Editar</button><button class="danger" data-b="r${r.id}">Borrar</button></div>`).join('')||'<p class="empty">Todavía no hay rutas. Pulsa «Nueva ruta».</p>';
  const as=data.areas.map(a=>`<div class="item"><div class="t"><b>${esc(a.name)}</b><small>${fecha(a.date)}${a.photos.length?' · '+a.photos.length+' fotos':''}</small></div><button data-v="a${a.id}">Ver</button><button class="danger" data-b="a${a.id}">Borrar</button></div>`).join('')||'<p class="empty">Todavía no hay áreas. Pulsa «Añadir área».</p>';
  modal(`<h2>Mis rutas</h2>${rs}<h2 style="margin-top:20px">Mis áreas</h2>${as}<div class="row"><button data-x>Cerrar</button></div>`,null,()=>{
    document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{
      const k=b.dataset.v,id=k.slice(1);closeModal();
      if(k[0]==='r'){const r=data.routes.find(x=>x.id==id);map.fitBounds(L.latLngBounds(r.coords),{padding:[40,40]})}
      else{const a=data.areas.find(x=>x.id==id);map.setView([a.lat,a.lng],15)}
    });
    document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{
      if(!confirm('¿Seguro que quieres borrarlo?'))return;
      const k=b.dataset.b,id=k.slice(1);
      if(k[0]==='r')data.routes=data.routes.filter(x=>x.id!=id);else data.areas=data.areas.filter(x=>x.id!=id);
      save();draw();closeModal();openList();
    });
  });
}

// Ventana emergente
let ov=null;
function closeModal(){if(ov){ov.remove();ov=null}}
function modal(html,onOk,onOpen){
  closeModal();ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML='<div class="card">'+html+'</div>';document.body.appendChild(ov);
  ov.querySelectorAll('[data-x]').forEach(b=>b.onclick=closeModal);
  const ok=ov.querySelector('#ok');
  if(ok&&onOk)ok.onclick=()=>{if(onOk()!==false)closeModal()};
  if(onOpen)onOpen();
  const f=ov.querySelector('input,textarea');if(f&&!f.type.match(/file|date/))f.focus();
}

map.on('click',e=>{if(mode==='route')pickStop({name:'Parada '+(pts.length+1),type:'libre',lat:e.latlng.lat,lng:e.latlng.lng});else if(mode==='area')openAreaForm(e.latlng)});
function syncTabs(){
  const pm=!$('panel').classList.contains('off'),pr=!$('legend').classList.contains('off');
  $('tm').textContent='☰ Menú '+(pm?'▾':'▸');$('tr').textContent='Mis rutas '+(pr?'▾':'▸');
  $('tm').setAttribute('aria-expanded',pm);$('tr').setAttribute('aria-expanded',pr);
}
$('tm').onclick=()=>{$('panel').classList.toggle('off');syncTabs()};
$('tr').onclick=()=>{$('legend').classList.toggle('off');syncTabs()};
if(innerWidth<560){$('panel').classList.add('off');$('legend').classList.add('off')}
draw();bar();syncTabs();
if(data.routes.length||data.areas.length){
  const b=L.featureGroup(saved.getLayers());if(b.getBounds().isValid())map.fitBounds(b.getBounds(),{padding:[40,40]});
}
</script>
</body>
</html>
