<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi autocaravana</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--ink:#16282c;--panel:#ffffff;--accent:#0d6b63;--accent-d:#094c47;--route:#ff7a1a;--warn:#b3261e;--line:#cfd8d6}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:18px/1.4 "Atkinson Hyperlegible",system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column;background:#dfe7e5}
input,textarea{font:inherit;padding:12px;border:2px solid var(--line);border-radius:10px;width:100%;color:var(--ink)}
input:focus,textarea:focus,button:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
button{font:inherit;font-weight:700;min-height:54px;padding:0 18px;border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer}
button:hover{background:var(--accent-d)}
button.sec{background:#e6eeec;color:var(--ink)}
button.sec:hover{background:#d3dfdc}
button.danger{background:#fbe9e7;color:var(--warn)}
#wrap{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0}
#bar button.on{background:var(--route);color:#16282c}
.pin{font-size:15px;line-height:1;filter:drop-shadow(0 2px 2px #0007)}
.dot{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--route)}
.overlay{position:fixed;inset:0;background:#000a;z-index:2000;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:var(--panel);border-radius:16px;padding:20px;width:100%;max-width:480px;max-height:92vh;overflow:auto}
.card h2{margin:0 0 12px;font-size:1.3rem}
.card label{display:block;font-weight:700;margin:12px 0 4px}
.row{display:flex;gap:8px;margin-top:16px}
.row button{flex:1}
.item{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item .t{flex:1}
.item small{color:#536b68;display:block}
.item button{min-height:44px;padding:0 12px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px;cursor:pointer}
.leaflet-popup-content{font:17px/1.4 "Atkinson Hyperlegible",system-ui,sans-serif;margin:14px 16px}
.leaflet-popup-content h3{margin:0 0 4px;font-size:1.15rem}
.big img{max-width:100%;max-height:85vh;border-radius:10px}
.empty{color:#536b68;padding:8px 0}
.lg{display:flex;gap:8px;align-items:flex-start;padding:9px 12px;cursor:pointer;border-bottom:1px solid #eef2f1}
.lg:hover{background:#f1f6f5}
.lg i{flex:none;width:30px;height:7px;border-radius:4px;margin-top:8px}
.lg b{display:block;line-height:1.2}
.lg small{color:#536b68;display:block}
.lg button{min-height:34px;padding:0 10px;margin-left:auto;background:#e6eeec;color:var(--ink);font-size:.9rem}
.handle{width:26px;height:26px;border-radius:50%;background:#fff;border:5px solid #16282c;box-shadow:0 1px 5px #0008;cursor:grab}
#sum b{color:#ffb703}
#search{display:flex;gap:6px;margin:0 0 8px}
#search input{padding:8px 10px;font-size:15px;min-width:0}
#search button{min-height:38px;padding:0 10px;font-size:14px}
#bar{display:flex;flex-direction:column;gap:6px}
#bar button{min-height:40px;font-size:15px;padding:0 12px;text-align:left}
.lg>div{min-width:0;flex:1}
#hint{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);z-index:1000;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;max-width:min(92%,640px);text-align:center;display:none;box-shadow:0 3px 12px #0005;font-size:16px}
#sum{display:none;gap:4px 22px;justify-content:center;flex-wrap:wrap;padding:5px 12px;font-size:15px;background:var(--ink);color:#fff;z-index:1000}
#side{position:absolute;left:10px;top:10px;z-index:1000;width:240px;max-height:calc(100% - 20px);overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:0 10px 10px 0;scrollbar-width:thin}
#tabs{display:flex;gap:8px;flex:none}
#tabs button{min-height:44px;font-size:15px;padding:0 10px;white-space:nowrap;flex:1;box-shadow:0 2px 8px #0005}
#panel,#legend{flex:none;background:var(--panel);border-radius:14px;box-shadow:0 2px 12px #0005}
#panel{padding:10px}
#legend{padding:4px 6px 6px}
#panel.off,#legend.off{display:none}
#legend h4{margin:0;padding:8px 6px 6px;font-size:1rem}
@media(max-width:560px){#side{width:210px}}
.dot{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--route);font:700 12px/18px sans-serif;text-align:center;color:#16282c}
.st{margin:6px 0 2px;padding-left:20px;font-size:.9rem}.st span{color:#536b68}
.leaflet-popup-content .row{margin-top:10px;flex-direction:column}
#legend .lg b{font-size:1.02rem}
.tl{margin:8px 0 4px}
.tl-stop{display:flex;gap:12px;align-items:flex-start}
.tl-dot{flex:none;width:30px;height:30px;border-radius:50%;border:4px solid;background:#fff;font:700 14px/22px sans-serif;text-align:center}
.tl-stop b{display:block;font-size:1.05rem;line-height:1.2;margin-top:2px}
.tl-stop small{color:#536b68;display:block}
.tl-leg{margin:2px 0 2px 13px;padding:8px 0 8px 24px;border-left:4px solid;font-weight:700;font-size:.95rem}
.tl-sum{margin:0 0 10px;color:#536b68}.tl-sum b{color:var(--ink)}
.sw{display:inline-block;width:28px;height:8px;border-radius:4px;margin-right:10px;vertical-align:middle}
body{font-size:15px}
input,textarea{padding:8px 10px}
button{min-height:42px;padding:0 14px}
.card{padding:16px}.card h2{font-size:1.1rem;margin-bottom:8px}.card label{margin:9px 0 3px}
.card label.chk{display:flex;gap:10px;align-items:center;font-weight:400;margin-top:14px}
.chk input{width:20px;height:20px;flex:none;padding:0}
#tabs button{min-height:34px;font-size:13.5px;padding:0 8px}
#bar button{min-height:32px;font-size:13.5px;padding:0 10px}
#search input{padding:5px 8px;font-size:13.5px}#search button{min-height:32px;font-size:13px;padding:0 8px}
#side{width:215px}#panel{padding:8px}#legend{padding:2px 4px 4px}
#legend h4{font-size:.9rem;padding:6px 6px 4px}
.lg{padding:5px 6px;align-items:center}.lg i{margin-top:0;width:24px}#legend .lg b{font-size:.92rem}
.lg button{min-height:26px;font-size:.78rem;padding:0 8px}
.lg input.vis{flex:none;width:17px;height:17px;padding:0;margin:0}
#sum{font-size:13px;padding:3px 10px}
#hint{font-size:13.5px;padding:7px 12px}
.leaflet-popup-content{font-size:14px;margin:10px 12px}.leaflet-popup-content h3{font-size:1rem}
.item{padding:7px 0}.item button{min-height:34px;font-size:.85rem}
.tl-stop b{font-size:.98rem}.tl-leg{font-size:.88rem}
.poi{display:inline-block;flex:none;width:18px;height:18px;border-radius:50%;border:2px solid #fff;color:#fff;font:700 10px/14px sans-serif;text-align:center;box-shadow:0 1px 4px #0008}
.poi.area{background:#1769d1}.poi.camping{background:#2e8b3d}
#res{margin:0 0 8px;max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:2px 6px;font-size:13px}
.rh{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 0}.rh a{cursor:pointer;color:var(--accent);font-weight:700;white-space:nowrap}
.ri{display:flex;gap:8px;align-items:center;padding:6px 2px;border-top:1px solid #eef2f1;cursor:pointer}.ri:hover{background:#f1f6f5}
.ri b{display:block;line-height:1.15}.ri small{color:#536b68}
.lg{gap:6px}.lg i{width:16px}.lg>div{flex:1 1 0;min-width:0}#legend .lg b{overflow-wrap:break-word;line-height:1.2}#side{width:235px}
#tabs{flex-wrap:nowrap;gap:5px}#tabs button{font-size:12px;padding:0 5px;flex:1 1 auto}#side{width:258px;overflow-x:hidden}
.yel{background:#f4b400!important;color:#16282c!important}.yel:hover{background:#d99e00!important}
#alist{flex:none;background:var(--panel);border-radius:14px;box-shadow:0 2px 12px #0005;padding:2px 4px 4px;border-top:6px solid #f4b400}
#alist.off{display:none}
#alist h4{margin:0;padding:6px 6px 4px;font-size:.9rem}
.al .pn{font-size:18px;flex:none}.al button{background:#fff0bd}.al button:hover{background:#ffe38a}
.ph{position:relative;display:inline-block}.ph b{position:absolute;top:2px;right:2px;background:#000b;color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;cursor:pointer}
.rec{margin:10px 0 4px;padding:8px 10px;background:#fff6d6;border-radius:10px;font-size:.88rem;line-height:1.5}
.rec .tot{margin-top:4px;padding-top:4px;border-top:1px solid #e8d48a;font-size:.95rem}
@media(max-width:560px){#side{width:226px}}
</style>
</head>
<body>
<div id="wrap">
  <div id="map"></div>
  <div id="side">
    <div id="tabs"><button id="tm">☰ Menú ▾</button><button id="tr" hidden>Mis rutas ▾</button><button id="ta" class="yel" hidden>Mis áreas ▸</button></div>
    <aside id="panel">
      <form id="search"><input id="q" placeholder="Buscar lugar o área" aria-label="Buscar lugar o área"><button>Buscar</button></form>
      <div id="res" hidden></div>
      <nav id="bar"></nav>
    </aside>
    <div id="legend" hidden></div>
    <div id="alist" class="off" hidden></div>
  </div>
  <div id="hint"></div>
</div>
<div id="sum"></div>
<input type="file" id="fi" accept=".json,application/json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const KEY='autocaravana-v1';
let data={routes:[],areas:[]};
try{data=JSON.parse(localStorage.getItem(KEY))||data}catch(e){}
data.routes.forEach(r=>{if(r.segs&&!r.coords)r.coords=r.segs.flatMap(s=>s.c)});
function save(){try{localStorage.setItem(KEY,JSON.stringify(data,function(k,v){return k==='coords'&&this.segs?undefined:v}));return true}catch(e){alert('No hay espacio para guardar más fotos. Prueba a borrar alguna.');return false}}
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const hm=s=>{const m=Math.round(s/60);return m<60?m+' min':Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min'};
const secs=a=>a.reduce((x,s)=>x+(s.t??s.d/22),0);
function eur(n){return n.toLocaleString('es-ES',{maximumFractionDigits:2})+' €'}
function coste(st){return st.reduce((a,s)=>a+(s.precio||0)*(s.noches||0),0)}
function nnoches(st){return st.reduce((a,s)=>a+(s.noches||0),0)}
function recuento(st){
  const l=st.filter(s=>s.noches>0);
  if(!l.length)return '<div class="rec">No has anotado noches de alojamiento.</div>';
  return '<div class="rec"><b>Recuento de noches</b>'+l.map(s=>`<div>${esc(s.name)}: ${s.noches} ${s.noches==1?'noche':'noches'} × ${eur(s.precio||0)} = <b>${eur((s.precio||0)*s.noches)}</b></div>`).join('')+`<div class="tot">Total: ${nnoches(st)} ${nnoches(st)==1?'noche':'noches'} · <b>${eur(coste(st))}</b></div></div>`;
}

// Mapa
const map=L.map('map',{zoomControl:false}).setView([40.2,-3.7],6);
L.control.zoom({position:'bottomright'}).addTo(map);
// Al encuadrar, deja libre la zona que tapa el menú
const _fb=map.fitBounds.bind(map);
map.fitBounds=(b,o={})=>{
  const m=o.padding?o.padding[0]:40,v=o.padding?o.padding[1]:40;
  const menu=(!$('panel').classList.contains('off')||(data.routes.length&&!$('legend').classList.contains('off'))||(data.areas.length&&!$('alist').classList.contains('off')))&&innerWidth>=560;
  return _fb(b,{maxZoom:o.maxZoom,paddingTopLeft:[menu?270:m,v],paddingBottomRight:[m,v]});
};
const sat=L.layerGroup([
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18,attribution:'Imagery © Esri'}),
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:18})
]);
// Mapa de carreteras: Esri (no pide permisos especiales) y, si fallara, Carto como respaldo
let calles=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Map © Esri, HERE, Garmin, OpenStreetMap'});
const plain=L.layerGroup([calles]);
let tErr=0,swapped=false;
calles.on('tileerror',()=>{
  if(++tErr<6||swapped)return;swapped=true;
  plain.removeLayer(calles);
  calles=L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd',attribution:'© OpenStreetMap © CARTO'});
  plain.addLayer(calles);
});
let isSat=true;sat.addTo(map);

// Barra de botones
let mode=null,selId=null,moveDraft=null;const areaMk={};
function bar(){
  const b=$('bar');
  if(mode)$('panel').classList.remove('off');
  syncTabs();
  if(mode==='route'){
    b.innerHTML='<button class="sec" id="undo">Deshacer último punto</button><button id="done">Terminar ruta</button><button class="danger" id="cancel">Cancelar</button>';
    $('undo').onclick=undoPoint;$('done').onclick=finishRoute;$('cancel').onclick=cancelMode;
  }else if(mode==='edit'){
    b.innerHTML='<button id="sv">Guardar cambios</button><button class="danger" id="cancel">Cancelar</button>';
    $('sv').onclick=saveEdit;$('cancel').onclick=cancelMode;
  }else if(mode==='move'){
    b.innerHTML='<button class="danger" id="cancel">Cancelar</button>';$('cancel').onclick=cancelMode;
  }else if(mode==='area'){
    b.innerHTML='<button class="danger" id="cancel">Cancelar</button>';$('cancel').onclick=cancelMode;
  }else{
    b.innerHTML='<button id="nr">Nueva ruta</button><button id="na">Añadir área</button><button class="sec" id="list">Mis rutas y áreas</button><button class="sec" id="lay">'+(isSat?'Ver mapa':'Ver satélite')+'</button><button class="sec" id="gr">Guardar rutas</button><button class="sec" id="cr">Cargar rutas</button>';
    $('nr').onclick=()=>startMode('route');$('na').onclick=()=>startMode('area');$('list').onclick=openList;$('lay').onclick=toggleLayer;$('gr').onclick=exportData;$('cr').onclick=()=>$('fi').click();
  }
}
function hint(t){const h=$('hint');h.style.display=t?'block':'none';h.textContent=t||''}
function startMode(m){mode=m;bar();hint(m==='route'?'Toca el mapa para añadir cada parada de la ruta.':'Toca el mapa donde estuvo el área.')}
function cancelMode(){mode=null;moveDraft=null;clearDraft();clearEdit();hint('');bar();draw()}
function toggleLayer(){if(isSat){map.removeLayer(sat);plain.addTo(map)}else{map.removeLayer(plain);sat.addTo(map)}isSat=!isSat;bar()}

// Buscar
// Buscador: lugares y áreas de autocaravana / campings (OpenStreetMap, solo al buscar)
const OVP=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter','https://overpass.openstreetmap.fr/api/interpreter','https://lz4.overpass-api.de/api/interpreter','https://z.overpass-api.de/api/interpreter'];
let ovI=0;
async function getJson(url,ms=10000){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error('el servidor respondió '+r.status);return await r.json()}
  finally{clearTimeout(t)}
}
async function overpass(q,msg){
  let motivo='sin conexión';
  for(let k=0;k<OVP.length;k++){
    const i=(ovI+k)%OVP.length,c=new AbortController(),t=setTimeout(()=>c.abort(),12000);
    if(k>0&&msg)msg('Probando otro servidor ('+(k+1)+' de '+OVP.length+')…');
    try{
      const r=await fetch(OVP[i],{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q),signal:c.signal});
      if(!r.ok){motivo='el servidor respondió '+r.status;continue}
      const tx=await r.text();if(tx.trim()[0]!=='{'){motivo='respuesta no válida';continue}
      const j=JSON.parse(tx);if(j.remark&&!j.elements.length){motivo='el servidor está saturado';continue}
      ovI=i;return j;
    }catch(e){motivo=e.name==='AbortError'?'el servidor tarda demasiado':'no se pudo conectar'}
    finally{clearTimeout(t)}
  }
  throw new Error(motivo);
}
const normEl=(el,ll)=>{
  const la=el.lat??el.center?.lat,lo=el.lon??el.center?.lon;if(la==null)return null;
  const t=el.tags||{},type=t.tourism==='camp_site'?'camping':'area';
  return{id:'f'+el.type[0]+el.id,name:t.name||(type==='camping'?'Camping sin nombre':'Área sin nombre'),type,lat:la,lng:lo,tags:t,dist:map.distance(ll,[la,lo])};
};
// Búsqueda por círculos: empieza cerca y se amplía solo si hay pocos resultados
async function buscarOverpass(ll,msg){
  let els=[],fallo=null;
  for(const R of [8000,20000,40000]){
    msg('Buscando áreas a '+R/1000+' km a la redonda…');
    try{
      const j=await overpass(`[out:json][timeout:20];(nwr["tourism"="caravan_site"](around:${R},${ll[0]},${ll[1]});nwr["tourism"="camp_site"](around:${R},${ll[0]},${ll[1]}););out center tags 80;`,msg);
      els=j.elements;fallo=null;
    }catch(e){fallo=e;break}
    if(els.length>=8)break;
  }
  if(fallo&&!els.length)throw fallo;
  return els.map(el=>normEl(el,ll)).filter(Boolean);
}
// Plan B si OpenStreetMap (Overpass) no responde: buscador Nominatim dentro de la zona
async function buscarNominatim(ll,msg){
  msg('Probando otro método de búsqueda…');
  const vb=`${ll[1]-0.3},${ll[0]+0.2},${ll[1]+0.3},${ll[0]-0.2}`,seen=new Set(),out=[];
  for(const t of ['caravan site','camp site','camping','área autocaravanas']){
    try{
      const r=await getJson(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=40&accept-language=es&bounded=1&viewbox=${vb}&q=${encodeURIComponent(t)}`);
      r.forEach(x=>{
        const k=x.osm_type+x.osm_id;if(seen.has(k)||x.category!=='tourism'||!['caravan_site','camp_site'].includes(x.type))return;seen.add(k);
        const type=x.type==='camp_site'?'camping':'area';
        out.push({id:'fn'+k,name:x.name||x.display_name.split(',')[0],type,lat:+x.lat,lng:+x.lon,tags:{},dist:map.distance(ll,[+x.lat,+x.lon])});
      });
    }catch(e){}
  }
  if(!out.length)throw new Error('sin resultados');
  return out;
}
async function geocode(q){
  try{
    const r=await getJson('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=es&q='+encodeURIComponent(q));
    return r.length?{ll:[+r[0].lat,+r[0].lon],lugar:r[0].display_name.split(',')[0]}:null;
  }catch(e){}
  try{
    const j=await getJson('https://photon.komoot.io/api/?limit=1&lang=es&q='+encodeURIComponent(q));
    const f=j.features&&j.features[0];
    return f?{ll:[f.geometry.coordinates[1],f.geometry.coordinates[0]],lugar:f.properties.name||q}:null;
  }catch(e){throw new Error('sin conexión')}
}
const found=L.layerGroup().addTo(map),foundInfo={},foundMk={};
function foundHtml(id,t,info){
  const sv=[];if(t.drinking_water==='yes')sv.push('💧 agua');if(t.sanitary_dump_station==='yes')sv.push('🚽 vaciado');if(t.power_supply==='yes')sv.push('🔌 electricidad');
  const web=t.website||t['contact:website']||'';
  return `<h3>${esc(info.name)}</h3>${info.type==='camping'?'Camping':'Área de autocaravanas'}`+(t.fee==='yes'?' · de pago':t.fee==='no'?' · gratis':'')+(sv.length?'<br>'+sv.join(' · '):'')+(t.phone?'<br>📞 '+esc(t.phone):'')+(/^https?:/.test(web)?`<br><a href="${esc(web)}" target="_blank" rel="noopener">Página web</a>`:'')+
    `<div class="row">${mode==='route'?`<button data-stop="f${id}">Añadir a la ruta</button>`:''}<button class="sec" data-save="f${id}">Guardar en mis áreas</button></div>`;
}
$('search').onsubmit=async e=>{
  if(e&&e.preventDefault)e.preventDefault();
  const q0=$('q').value.trim();if(!q0)return;
  const res=$('res');res.hidden=false;found.clearLayers();
  const cab=t=>`<div class="rh"><b>${t}</b><a data-close>✕ Cerrar</a></div>`;
  const fallo=t=>{res.innerHTML=cab(t)+'<div class="rh"><a data-retry>↻ Reintentar</a></div>'};
  const msg=t=>{res.innerHTML=cab(t)};
  msg('Buscando…');
  const q=q0.replace(/\b(áreas?|areas?|autocaravanas?|caravanas?|campings?|camper)\b/gi,'').replace(/\s+/g,' ').trim()||q0;
  let g;
  try{g=await geocode(q)}catch(err){fallo('No se pudo buscar el lugar. Comprueba tu conexión.');return}
  if(!g){msg('No encuentro ese lugar. Prueba con otro nombre.');return}
  const ll=g.ll,lugar=g.lugar;
  map.setView(ll,12);
  let L2;
  try{L2=await buscarOverpass(ll,m=>msg(m))}
  catch(e1){
    try{L2=await buscarNominatim(ll,m=>msg(m))}
    catch(e2){fallo('He ido a '+esc(lugar)+', pero no he podido cargar las áreas ('+esc(e1.message)+').');return}
  }
  L2.sort((a,b)=>a.dist-b.dist);
  if(!L2.length){msg('No hay áreas ni campings cerca de '+esc(lugar)+'. Prueba con un pueblo o ciudad cercana.');return}
  L2.slice(0,80).forEach(i=>{
    foundInfo[i.id]=i;
    foundMk[i.id]=L.marker([i.lat,i.lng],{icon:L.divIcon({className:'',html:`<div class="poi ${i.type}">${i.type==='camping'?'C':'A'}</div>`,iconSize:[18,18],iconAnchor:[9,9],popupAnchor:[0,-9]})}).bindPopup(()=>foundHtml(i.id.slice(1),i.tags,i)).addTo(found);
  });
  map.fitBounds(L.latLngBounds(L2.slice(0,40).map(i=>[i.lat,i.lng]).concat([ll])),{maxZoom:14,padding:[40,40]});
  res.innerHTML=cab((L2.length==1?'1 sitio':L2.length+' sitios')+' cerca de '+esc(lugar))+L2.slice(0,40).map(i=>`<div class="ri" data-go="${i.id}"><span class="poi ${i.type}">${i.type==='camping'?'C':'A'}</span><div><b>${esc(i.name)}</b><small>${i.type==='camping'?'Camping':'Área de autocaravanas'} · ${(i.dist/1000).toFixed(1).replace('.',',')} km</small></div></div>`).join('');
};

// Crear ruta
let pts=[],segs=[],stops=[],draftGroup=L.layerGroup().addTo(map),draftLine=null,busy=false;
function clearDraft(){pts=[];segs=[];stops=[];draftGroup.clearLayers();draftLine=null}
function km(){return segs.reduce((s,x)=>s+x.d,0)/1000}
function redraw(){
  draftGroup.clearLayers();
  const all=segs.flatMap(s=>s.c);
  if(all.length)L.polyline(all,{color:'#ff7a1a',weight:6,opacity:.95}).addTo(draftGroup);
  pts.forEach((p,i)=>L.marker(p,{icon:L.divIcon({className:'',html:'<div class="dot">'+(i+1)+'</div>',iconSize:[24,24],iconAnchor:[12,12]}),interactive:false}).addTo(draftGroup));
  hint(pts.length<2?'Toca el mapa para añadir la siguiente parada.':'Llevas '+km().toFixed(1)+' km · '+hm(secs(segs))+(coste(stops)?' · '+eur(coste(stops)):'')+'. Sigue añadiendo paradas o pulsa «Terminar ruta».');
}
function pickStop(info){
  const last=[...stops].reverse().find(s=>s.hasta)?.hasta||new Date().toISOString().slice(0,10);
  const go=(h,p,n)=>addPoint({...info,name:$('pn').value.trim()||info.name},h,p,n);

  modal(`<h2>Nueva parada</h2><label for="pn">Nombre</label><input id="pn" value="${esc(info.name)}">
    <label for="h">¿Hasta cuándo te quedas aquí?</label><input id="h" type="date" value="${last}">
    <label for="pr">Precio de una noche (€)</label><input id="pr" type="text" inputmode="decimal" placeholder="Ej. 12 o 12,50">
    <label for="nn">Número de noches que me quedo</label><input id="nn" type="number" min="0" step="1" inputmode="numeric" value="1">
    <div class="row" style="flex-direction:column"><button id="ok">Aceptar</button><button class="sec" id="np">Solo paso por aquí</button><button class="sec" data-x>Cancelar</button></div>`,
    ()=>go($('h').value,num('pr'),Math.round(num('nn'))),()=>{$('np').onclick=()=>{go('',0,0);closeModal()}});
}
async function addPoint(info,hasta,precio,noches){
  if(busy)return;
  const p=[info.lat,info.lng],st={name:info.name,type:info.type,hasta:hasta||'',precio:precio||0,noches:noches||0};
  if(!pts.length){pts.push(p);stops.push(st);redraw();return}
  busy=true;hint('Calculando…');
  const seg=await routeBetween(pts[pts.length-1],p);
  segs.push(seg);pts.push(p);stops.push(st);busy=false;redraw();
}
function undoPoint(){if(pts.length>1){pts.pop();segs.pop();stops.pop()}else{pts=[];stops=[]}redraw()}
function finishRoute(){
  if(segs.length<1){alert('Marca al menos dos puntos en el mapa.');return}
  const hoy=new Date();const d=hoy.toISOString().slice(0,10);const d0=stops.find(s=>s.hasta)?.hasta||d,d1=[...stops].reverse().find(s=>s.hasta)?.hasta||d0;

    <label for="n">Nombre</label><input id="n" value="Ruta del ${hoy.toLocaleDateString('es-ES')}">
    <label for="d">Día que empecé</label><input id="d" type="date" value="${d0}">
    <label for="e">Día que terminé</label><input id="e" type="date" value="${d1}">
    <label class="chk"><input id="hid" type="checkbox"> Esconder esta ruta del mapa</label>
    <div class="row"><button class="sec" data-x>Seguir editando</button><button id="ok">Guardar</button></div>`,
    ()=>{
      let ini=$('d').value,fin=$('e').value||ini;if(fin<ini)fin=ini;
      data.routes.push({id:Date.now(),name:$('n').value.trim()||'Ruta sin nombre',date:ini,end:fin,hidden:$('hid').checked,color:colors[data.routes.length%colors.length],km:km(),pts:pts.slice(),segs:segs.slice(),stops:stops.slice(),t:secs(segs),coords:segs.flatMap(s=>s.c)});
      if(!save())return false;mode=null;clearDraft();hint('');bar();draw();

async function shrink(file){
  const bmp=await createImageBitmap(file);const s=Math.min(1,700/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=bmp.width*s;c.height=bmp.height*s;
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.65);

// Editar una ruta guardada
let ed=null,edBusy=false;const editGroup=L.layerGroup().addTo(map);
async function routeBetween(a,b){
  try{
    const j=await (await fetch(`https://router.project-osrm.org/route/v1/driving/${a[1]},${a[0]};${b[1]},${b[0]}?overview=full&geometries=geojson`)).json();
    const r=j.routes[0];return{c:r.geometry.coordinates.map(x=>[x[1],x[0]]),d:r.distance,t:r.duration};
  }catch(e){return{c:[a,b],d:map.distance(a,b),t:map.distance(a,b)/22}}
}
function clearEdit(){ed=null;editGroup.clearLayers()}
function startEdit(id){
  const r=data.routes.find(x=>x.id==id);if(!r)return;
  if(!r.color)r.color=colors[data.routes.indexOf(r)%colors.length];
  let P,S;
  if(r.pts&&r.segs){P=r.pts.map(p=>p.slice());S=r.segs.map(s=>({c:s.c,d:s.d,t:s.t}))}
  else{
    const n=r.coords.length,k=Math.min(8,n-1),idx=[];
    for(let i=0;i<=k;i++)idx.push(Math.round(i*(n-1)/k));
    P=idx.map(i=>r.coords[i]);S=[];
    for(let i=0;i<k;i++){const c=r.coords.slice(idx[i],idx[i+1]+1);let d=0;for(let j=1;j<c.length;j++)d+=map.distance(c[j-1],c[j]);S.push({c,d})}
  }
  closeModal();map.closePopup();clearDraft();
  const T=(r.stops&&r.stops.length===P.length)?r.stops.map(x=>({...x})):P.map((_,i)=>({name:'Punto '+(i+1),type:'libre',hasta:''}));ed={r,pts:P,segs:S,stops:T};mode='edit';bar();draw();drawEdit();
  map.fitBounds(L.latLngBounds(r.coords),{padding:[70,70]});
}
function drawEdit(){
  editGroup.clearLayers();if(!ed)return;
  const color=ed.r.color;
  ed.segs.forEach((s,i)=>L.polyline(s.c,{color,weight:9,opacity:.95}).addTo(editGroup)
    .on('click',e=>{L.DomEvent.stopPropagation(e);insertPoint(i,e.latlng)}));
  ed.pts.forEach((p,i)=>{
    const m=L.marker(p,{draggable:true,icon:L.divIcon({className:'',html:'<div class="handle"></div>',iconSize:[26,26],iconAnchor:[13,13]})}).addTo(editGroup);
    m.on('dragend',()=>movePoint(i,m.getLatLng()));
    m.on('click',()=>{
      const st=ed.stops[i]||{},box=document.createElement('div');
      box.innerHTML='<h3>'+esc(st.name||'Punto '+(i+1))+'</h3>'+(st.hasta?'Hasta '+fmt(st.hasta):'Solo paso por aquí')+'<div class="row"></div>';
      const b1=document.createElement('button');b1.className='sec';b1.textContent='Cambiar nombre y fecha';b1.onclick=()=>{map.closePopup();editStop(i)};
      box.lastChild.appendChild(b1);
      if(ed.pts.length>2){const b2=document.createElement('button');b2.textContent='Quitar este punto';b2.onclick=()=>{map.closePopup();removePoint(i)};box.lastChild.appendChild(b2)}
      m.bindPopup(box).openPopup();
    });
  });
  const k=ed.segs.reduce((a,s)=>a+s.d,0)/1000;
  hint('Editando «'+ed.r.name+'» · '+k.toFixed(1)+' km. Arrastra un punto blanco para corregir. Toca la línea para añadir un punto. Toca un punto para quitarlo.');
}
async function movePoint(i,ll){
  if(edBusy){drawEdit();return}
  edBusy=true;hint('Calculando…');ed.pts[i]=[ll.lat,ll.lng];
  if(i>0)ed.segs[i-1]=await routeBetween(ed.pts[i-1],ed.pts[i]);
  if(i<ed.pts.length-1)ed.segs[i]=await routeBetween(ed.pts[i],ed.pts[i+1]);
  edBusy=false;drawEdit();
}
async function insertPoint(i,ll){
  if(edBusy)return;edBusy=true;hint('Calculando…');
  const p=[ll.lat,ll.lng];
  const s1=await routeBetween(ed.pts[i],p),s2=await routeBetween(p,ed.pts[i+1]);
  ed.pts.splice(i+1,0,p);ed.segs.splice(i,1,s1,s2);ed.stops.splice(i+1,0,{name:'Punto de paso',type:'libre',hasta:''});edBusy=false;drawEdit();
}
async function removePoint(i){
  if(edBusy)return;edBusy=true;hint('Calculando…');
  const n=ed.pts.length;ed.pts.splice(i,1);ed.stops.splice(i,1);
  if(i===0)ed.segs.splice(0,1);
  else if(i===n-1)ed.segs.splice(n-2,1);
  else{const s=await routeBetween(ed.pts[i-1],ed.pts[i]);ed.segs.splice(i-1,2,s)}
  edBusy=false;drawEdit();
}
function editStop(i){
  const st=ed.stops[i];
  modal(`<h2>Parada ${i+1}</h2><label for="sn">Nombre</label><input id="sn" value="${esc(st.name)}">
    <label for="sh">Hasta cuándo me quedo</label><input id="sh" type="date" value="${st.hasta||''}">
    <label for="sp">Precio de una noche (€)</label><input id="sp" type="text" inputmode="decimal" placeholder="Ej. 12 o 12,50" value="${st.precio||''}">
    <label for="sx">Número de noches</label><input id="sx" type="number" min="0" step="1" inputmode="numeric" value="${st.noches||0}">
    <div class="row"><button class="sec" data-x>Cancelar</button><button id="ok">Aceptar</button></div>`,
    ()=>{st.name=$('sn').value.trim()||st.name;st.hasta=$('sh').value;
      st.precio=Math.max(0,parseFloat(String($('sp').value).replace(',','.'))||0);st.noches=Math.max(0,Math.round(parseFloat($('sx').value)||0));drawEdit()});
}
function saveEdit(){
  if(edBusy)return;
  const r=ed.r,k=ed.segs.reduce((a,s)=>a+s.d,0)/1000;
  modal(`<h2>Guardar cambios</h2><p>${k.toFixed(1)} km · ${hm(secs(ed.segs))} conduciendo</p>${recuento(ed.stops)}
    <label for="n">Nombre</label><input id="n" value="${esc(r.name)}">

    <div class="row"><button class="sec" data-x>Seguir editando</button><button id="ok">Guardar</button></div>`,
    ()=>{
      const ini=$('d').value;let fin=$('e').value||ini;if(fin<ini)fin=ini;
      Object.assign(r,{name:$('n').value.trim()||'Ruta sin nombre',date:ini,end:fin,hidden:$('hid').checked,km:k,pts:ed.pts,segs:ed.segs,stops:ed.stops,t:secs(ed.segs),coords:ed.segs.flatMap(s=>s.c)});
      if(!save())return false;

}

// Ventana de la ruta: cronología con paradas y tiempos
function openRoute(r){

      const g=r.segs&&r.segs[i];
      if(g)tl+=`<div class="tl-leg" style="border-color:${color}">🚐 ${g.d<10000?(g.d/1000).toFixed(1):(g.d/1000).toFixed(0)} km · ${hm(g.t??g.d/22)}</div>`;

    <label for="t">Notas</label><textarea id="t" rows="3">${esc(a.notes)}</textarea>
    <label>Fotos</label><div class="thumbs" id="th"></div>
    <label for="f">Añadir fotos</label><input id="f" type="file" accept="image/*" multiple>
    <div class="row"><button class="sec" id="mv">Cambiar posición</button><button class="danger" id="del">Borrar área</button></div>
    <div class="row"><button class="sec" data-x>Cancelar</button><button id="ok">Guardar cambios</button></div>`,
    ()=>{const old={...a};Object.assign(a,campos());if(!save()){Object.assign(a,old);return false}draw()},
    ()=>{
      const paint=()=>{$('th').innerHTML=photos.map((p,i)=>`<span class="ph"><img src="${p}" alt=""><b data-rm="${i}">×</b></span>`).join('');
        $('th').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{photos.splice(+b.dataset.rm,1);paint()})};
      paint();
      $('f').onchange=async e=>{for(const f of e.target.files){try{photos.push(await shrink(f))}catch(err){}}paint()};
      $('mv').onclick=()=>{moveDraft={id:a.id,f:campos()};closeModal();mode='move';bar();hint('Toca el mapa donde quieres colocar «'+a.name+'».')};
      $('del').onclick=()=>{if(!confirm('¿Seguro que quieres borrar esta área?'))return;data.areas=data.areas.filter(x=>x.id!=a.id);save();closeModal();draw()};
    });
}
function applyMove(ll){
  const d=moveDraft;if(!d)return;const a=data.areas.find(x=>x.id==d.id);
  Object.assign(a,d.f,{lat:ll.lat,lng:ll.lng});moveDraft=null;mode=null;hint('');bar();save();draw();editArea(a.id);
}

// Paradas de la ruta seleccionada
const selGroup=L.layerGroup().addTo(map);
function drawSel(){
  selGroup.clearLayers();const r=data.routes.find(x=>x.id==selId);if(!r||!r.pts)return;
  r.pts.forEach((p,i)=>{const s=(r.stops||[])[i]||{};
    L.marker(p,{icon:L.divIcon({className:'',html:'<div class="dot">'+(i+1)+'</div>',iconSize:[24,24],iconAnchor:[12,12]})}).addTo(selGroup)
      .bindPopup('<h3>'+esc(s.name||'Punto '+(i+1))+'</h3>'+(s.hasta?'Hasta '+fmt(s.hasta):'Solo paso por aquí'))});
}

// Dibujar lo guardado
const saved=L.layerGroup().addTo(map);
const colors=['#ff7a1a','#e63946','#ffd60a','#4cc9f0','#b5179e','#80ed99'];
function draw(){
  saved.clearLayers();
  data.routes.forEach((r,i)=>{
    if(ed&&ed.r===r||r.hidden)return;
    L.polyline(r.coords,{color:col(r,i),weight:5,opacity:.9}).addTo(saved)
      .bindPopup(`<h3>${esc(r.name)}</h3>${rango(r)} · ${r.km.toFixed(1)} km${r.t?' · '+hm(r.t):''}<div class="row"><button data-edit="${r.id}">Editar ruta</button></div>`);
  });
  legend();drawSel();areasList();
  data.areas.forEach(a=>{
    areaMk[a.id]=L.marker([a.lat,a.lng],{icon:L.divIcon({className:'',html:'<div class="pin">🚐</div>',iconSize:[16,16],iconAnchor:[8,14],popupAnchor:[0,-12]})}).addTo(saved)
      .bindPopup(()=>`<h3>${esc(a.name)}</h3>${esc(a.date)}${a.notes?'<br>'+esc(a.notes):''}<div class="thumbs">${a.photos.map((p,i)=>`<img src="${p}" alt="Foto ${i+1}" data-a="${a.id}" data-i="${i}">`).join('')}</div>${mode==='route'?`<div class="row"><button data-stop="u${a.id}">Añadir a la ruta</button></div>`:''}<div class="row"><button class="sec" data-editarea="${a.id}">Editar área</button></div>`);
  });
}
document.addEventListener('click',e=>{
  const eb=e.target.closest('[data-edit]');
  const ea=e.target.closest('[data-editarea]');
  if(ea){editArea(ea.dataset.editarea);return}
  if(eb){startEdit(eb.dataset.edit);return}
  const sb=e.target.closest('[data-stop]');
  if(sb){const k=sb.dataset.stop;let a=foundInfo[k];if(!a){const x=data.areas.find(y=>y.id==k.slice(1));a={name:x.name,type:'mia',lat:x.lat,lng:x.lng}}map.closePopup();pickStop(a);return}
  const sv=e.target.closest('[data-save]');
  if(sv){const i=foundInfo[sv.dataset.save];map.closePopup();openAreaForm({lat:i.lat,lng:i.lng},i.name);return}
  if(e.target.closest('[data-close]')){$('res').hidden=true;found.clearLayers();return}
  if(e.target.closest('[data-retry]')){$('search').onsubmit({});return}
  const gg=e.target.closest('[data-go]');
  if(gg){const i=foundInfo[gg.dataset.go];if(innerWidth<560){$('panel').classList.add('off');syncTabs()}map.setView([i.lat,i.lng],16);foundMk[gg.dataset.go].openPopup();return}
  const im=e.target.closest('.thumbs img[data-a]');
  if(im){const a=data.areas.find(x=>x.id==im.dataset.a);modal(`<div class="big"><img src="${a.photos[im.dataset.i]}" alt=""></div><div class="row"><button data-x>Cerrar</button></div>`)}
});

// Lista
function openList(){
  const fecha=s=>s?new Date(s).toLocaleDateString('es-ES'):'';
  const rs=data.routes.map(r=>`<div class="item"><div class="t"><b>${esc(r.name)}</b><small>${rango(r)} · ${r.km.toFixed(1)} km${r.t?' · '+hm(r.t):''}</small></div><button data-v="r${r.id}">Ver</button><button class="sec" data-edit="${r.id}">Editar</button><button class="danger" data-b="r${r.id}">Borrar</button></div>`).join('')||'<p class="empty">Todavía no hay rutas. Pulsa «Nueva ruta».</p>';
  const as=data.areas.map(a=>`<div class="item"><div class="t"><b>${esc(a.name)}</b><small>${fecha(a.date)}${a.photos.length?' · '+a.photos.length+' fotos':''}</small></div><button data-v="a${a.id}">Ver</button><button class="sec" data-editarea="${a.id}">Editar</button><button class="danger" data-b="a${a.id}">Borrar</button></div>`).join('')||'<p class="empty">Todavía no hay áreas. Pulsa «Añadir área».</p>';
  modal(`<h2>Mis rutas</h2>${rs}<h2 style="margin-top:20px">Mis áreas</h2>${as}<div class="row"><button data-x>Cerrar</button></div>`,null,()=>{
    document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{
      const k=b.dataset.v,id=k.slice(1);closeModal();
      if(k[0]==='r'){const r=data.routes.find(x=>x.id==id);map.fitBounds(L.latLngBounds(r.coords),{padding:[40,40]})}
      else{const a=data.areas.find(x=>x.id==id);map.setView([a.lat,a.lng],15)}
    });
    document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{
      if(!confirm('¿Seguro que quieres borrarlo?'))return;
      const k=b.dataset.b,id=k.slice(1);
      if(k[0]==='r')data.routes=data.routes.filter(x=>x.id!=id);else data.areas=data.areas.filter(x=>x.id!=id);
      save();draw();closeModal();openList();
    });
  });
}

// Ventana emergente
let ov=null;
function closeModal(){if(ov){ov.remove();ov=null}}
function modal(html,onOk,onOpen){
  closeModal();ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML='<div class="card">'+html+'</div>';document.body.appendChild(ov);
  ov.querySelectorAll('[data-x]').forEach(b=>b.onclick=closeModal);
  const ok=ov.querySelector('#ok');
  if(ok&&onOk)ok.onclick=()=>{if(onOk()!==false)closeModal()};
  if(onOpen)onOpen();
  const f=ov.querySelector('input,textarea');if(f&&!f.type.match(/file|date/))f.focus();
}

map.on('click',e=>{if(mode==='route')pickStop({name:'Parada '+(pts.length+1),type:'libre',lat:e.latlng.lat,lng:e.latlng.lng});else if(mode==='area')openAreaForm(e.latlng);else if(mode==='move')applyMove(e.latlng)});
function syncTabs(){
  const pm=!$('panel').classList.contains('off'),pr=!$('legend').classList.contains('off');
  $('tm').textContent='☰ Menú '+(pm?'▾':'▸');$('tr').textContent='Mis rutas '+(pr?'▾':'▸');
  $('ta').textContent='Mis áreas '+(!$('alist').classList.contains('off')?'▾':'▸');
  $('tm').setAttribute('aria-expanded',pm);$('tr').setAttribute('aria-expanded',pr);
}
$('tm').onclick=()=>{$('panel').classList.toggle('off');syncTabs()};
$('tr').onclick=()=>{$('legend').classList.toggle('off');syncTabs()};
$('ta').onclick=()=>{$('alist').classList.toggle('off');syncTabs()};
if(innerWidth<560){$('panel').classList.add('off');$('legend').classList.add('off')}
draw();bar();syncTabs();
if(data.routes.length||data.areas.length){
  const b=L.featureGroup(saved.getLayers());if(b.getBounds().isValid())map.fitBounds(b.getBounds(),{padding:[40,40]});
}
</script>
</body>
</html>
